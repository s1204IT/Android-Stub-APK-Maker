name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      package:
          type: string
          description: "Package ID"
          required: true
          default: "com.android.example"
      target_sdk:
          type: choice
          options: [ 37, 36, 35, 34, 33, 32, 31, 30, 29, 28, 27, 26, 25, 24, 23, 22, 21, 20, 19, 18, 17, 16, 15, 14, 13, 12, 11, 10, 9, 8 ]
          description: "Target sdk"
          required: true
          default: "35"
      app_name:
          type: string
          description: "App name"
          required: false
          default: ""
      sign:
          type: boolean
          description: Custom signing
          required: true
          default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Apply customization
        run: |
          # Set package ID
          if [ "${{ inputs.package }}" != "" ]; then
            sed -i -e 's/com.android.example/${{ inputs.package }}/' AndroidManifest.xml
          fi

          # Set app name
          if [ "${{ inputs.app_name }}" != "" ]; then
            sed -i -e 's/\"\"/\"${{ inputs.app_name }}\"/' AndroidManifest.xml
          else
            sed -i -e '/label=/d' AndroidManifest.xml
          fi

          # Override certificates
          if [ "${{ inputs.sign }}" == "true" ]; then
            echo "${{ secrets.CERT }}" > data/cert.pem
            echo "${{ secrets.KEY }}" | base64 -d > data/cert.pk8
          fi

      - name: Make
        run: |
          export PATH=$PATH:$ANDROID_HOME/build-tools/37.0.0
          ./build.sh "${{ inputs.target_sdk }}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: "stub.apk"
          archive: false
